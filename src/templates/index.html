<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Engine Interface</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <div class="app-container">
        <header class="page-header">
            <h1 class="page-title">AI Engine Interface</h1>
            <p class="page-description">Advanced telemetry inference powered by Unsupervised & Reinforcement Learning models.</p>
        </header>

        <main class="dashboard-grid">
            <!-- Left Panel: Input -->
            <section class="card">
                <div class="card-header">
                    <h2 class="card-title">Telemetry Sync</h2>
                </div>
                <div class="card-content">
                    <form id="student-form">
                        <div class="form-group">
                            <label class="form-label" for="study_hours">Weekly Study Hours</label>
                            <div class="input-wrapper">
                                <input type="number" id="study_hours" class="input-field" required min="0" max="100">
                                <span class="input-suffix">HRS</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="last_score">Last Assessment Score</label>
                            <div class="input-wrapper">
                                <input type="number" id="last_score" class="input-field" required min="0" max="20">
                                <span class="input-suffix">/20</span>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary" id="submit-btn">
                            Initialize Sequence
                        </button>
                    </form>
                </div>
            </section>

            <!-- Right Panel: Output -->
            <section class="card">
                <div class="card-header">
                    <h2 class="card-title">Neural Output</h2>
                </div>
                <div class="card-content">
                    <div id="status-view" class="status-indicator">
                        <svg class="status-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span class="status-text">Awaiting telemetry...</span>
                    </div>

                    <div id="results-view" class="results-container hidden">
                        <div class="result-item">
                            <span class="result-label">Unsupervised Cluster</span>
                            <span class="result-value" id="out-profile">-</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">Q-Learning Policy</span>
                            <span class="result-value" id="out-action">-</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const form = document.getElementById('student-form');
        const btn = document.getElementById('submit-btn');
        const statusView = document.getElementById('status-view');
        const resultsView = document.getElementById('results-view');
        
        // Setup icons
        const iconWaiting = `<circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>`;
        const iconLoading = `<path d="M21 12a9 9 0 1 1-6.219-8.56"></path>`;
        const iconError = `<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>`;
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Loading State
            btn.innerText = 'Processing...';
            btn.disabled = true;
            resultsView.classList.add('hidden');
            
            statusView.classList.remove('hidden');
            statusView.classList.add('computing');
            statusView.querySelector('.status-icon').innerHTML = iconLoading;
            statusView.querySelector('.status-text').innerText = 'Running Inference...';

            const data = {
                study_hours: document.getElementById('study_hours').value,
                last_score: document.getElementById('last_score').value
            };

            try {
                const fetchReq = fetch('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).then(r => r.json());
                
                // Keep the loading state slightly longer for better UX
                const [_, result] = await Promise.all([
                    new Promise(resolve => setTimeout(resolve, 600)),
                    fetchReq
                ]);
                
                // Show results
                statusView.classList.add('hidden');
                statusView.classList.remove('computing');
                resultsView.classList.remove('hidden');
                
                document.getElementById('out-profile').innerText = result.simulated_profile;
                document.getElementById('out-action').innerText = result.recommended_action;
                
            } catch (error) {
                console.error(error);
                statusView.classList.remove('computing');
                statusView.querySelector('.status-icon').innerHTML = iconError;
                statusView.querySelector('.status-text').innerText = 'Connection Error';
            } finally {
                btn.innerText = 'Initialize Sequence';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
