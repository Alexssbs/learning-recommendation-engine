name: Continuous Deployment (CD - Render)

on:
  workflow_run:
    workflows: ["Continuous Integration (CI)"]
    types:
      - completed
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Solo despliega si los tests del CI pasaron (opcional, pero buena práctica MLOps)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    
    steps:
    - name: Trigger Render Deployment via Webhook
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
          echo "Advertencia: El secreto RENDER_DEPLOY_HOOK_URL no está configurado."
          echo "Agrega el Deploy Hook de Render en Settings > Secrets and variables > Actions."
          exit 0
        fi
        echo "Desplegando nueva versión en producción..."
        curl -X POST "$RENDER_DEPLOY_HOOK_URL"
